name: Helm release

# Public API for chart-only repos. On a push to a release branch: version → bump chart
# versions → package and publish → tag and GitHub release. Wiring only; see CLAUDE.md.
#
#   on: { push: { branches: [main] } }
#   permissions: { contents: write, issues: write, pull-requests: write, packages: write, id-token: write }
#   jobs:
#     release:
#       uses: at-blacknight-projects/ci-templates/.github/workflows/helm-release.yml@v1
#       secrets:
#         app-id: ${{ secrets.RELEASE_APP_ID }}
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      charts: { description: "Chart directories, one per line. Empty finds every Chart.yaml.", type: string, default: "" }
      chart-app-version: { description: Set appVersion as well as version., type: boolean, default: false }
      chart-values: { description: yq paths in values.yaml set to the version., type: string, default: "" }
      oci-registry: { description: 'Chart OCI destination. Empty means oci://ghcr.io/<owner>/charts; "none" skips OCI.', type: string, default: "" }
      index-repo: { description: owner/repo of a classic chart index. Empty skips it., type: string, default: "" }
      index-branch: { description: Branch of index-repo., type: string, default: main }
      index-url: { description: Public URL of index-repo., type: string, default: "" }
      sign: { description: Sign charts pushed to OCI with cosign., type: boolean, default: true }
      replacements: { description: 'JSON array of {"file", "pattern", "replacement"} version edits.', type: string, default: "[]" }
      bump-command: { description: Extra version-bump command (VERSION is set)., type: string, default: "" }
      git-user-name: { description: Committer of the release commit., type: string, default: "Release Bot" }
      git-user-email: { description: Committer email of the release commit., type: string, default: "release-bot@users.noreply.github.com" }
    secrets:
      app-id: { required: false, description: GitHub App ID for releases past branch protection. }
      app-private-key: { required: false, description: GitHub App private key. }
      registry-username: { required: false, description: OCI registry user (empty uses GITHUB_TOKEN on ghcr.io). }
      registry-password: { required: false, description: OCI registry password or token. }
      index-token: { required: false, description: Token that can push to index-repo. }
    outputs:
      version: { description: Released version (empty if nothing was released)., value: "${{ jobs.release.outputs.version }}" }
      git-tag: { description: Released tag., value: "${{ jobs.release.outputs.git-tag }}" }

permissions:
  contents: read

jobs:
  version:
    name: Version
    uses: ./.github/workflows/stage-version-detect.yml
    secrets:
      app-id: ${{ secrets.app-id }}
      app-private-key: ${{ secrets.app-private-key }}

  bump:
    name: Bump
    needs: version
    if: needs.version.outputs.would-release == 'true'
    uses: ./.github/workflows/stage-version-bump.yml
    with:
      version: ${{ needs.version.outputs.version }}
      charts: ${{ inputs.charts }}
      chart-app-version: ${{ inputs.chart-app-version }}
      chart-values: ${{ inputs.chart-values }}
      replacements: ${{ inputs.replacements }}
      bump-command: ${{ inputs.bump-command }}

  chart:
    name: Chart
    needs: [version, bump]
    uses: ./.github/workflows/stage-helm-package.yml
    permissions: { contents: read, packages: write, id-token: write }
    with:
      charts: ${{ inputs.charts }}
      publish: true
      restore-artifact: release-files
      oci-registry: ${{ inputs.oci-registry }}
      index-repo: ${{ inputs.index-repo }}
      index-branch: ${{ inputs.index-branch }}
      index-url: ${{ inputs.index-url }}
      sign: ${{ inputs.sign }}
    secrets:
      index-token: ${{ secrets.index-token }}
      registry-username: ${{ secrets.registry-username }}
      registry-password: ${{ secrets.registry-password }}

  release:
    name: Release
    needs: [version, bump, chart]
    uses: ./.github/workflows/stage-release-semantic.yml
    permissions: { contents: write, issues: write, pull-requests: write }
    with:
      git-user-name: ${{ inputs.git-user-name }}
      git-user-email: ${{ inputs.git-user-email }}
      download-artifacts: false
      restore-artifact: release-files
      git-commit-files: ${{ needs.bump.outputs.files }}
    secrets:
      app-id: ${{ secrets.app-id }}
      app-private-key: ${{ secrets.app-private-key }}
