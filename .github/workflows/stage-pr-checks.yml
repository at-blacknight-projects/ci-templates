name: PR checks (stage)

# Pull-request hygiene for squash-merge repos, where the PR title becomes the commit
# message that semantic-release reads. Fails a PR whose title isn't a conventional
# commit (`feat: …`, `fix(scope)!: …`).
#
# Call it only on pull_request events. Caller grants: pull-requests: read.

on:
  workflow_call:
    inputs:
      types:
        description: Allowed commit types, one per line. Empty means the conventional commits defaults.
        type: string
        default: ""
      require-scope:
        description: "Require a scope, as in `feat(api): …`."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.require-scope }}
