name: Container release

# Public API for repos that ship container images. On a push to a release branch:
# version → bump → build, scan, push, sign and attest every image → tag and GitHub
# release. The tag is created last. Wiring only; see CLAUDE.md.
#
#   on: { push: { branches: [main, alpha] } }
#   permissions: { contents: write, issues: write, pull-requests: write, packages: write, id-token: write, attestations: write, security-events: write }
#   jobs:
#     release:
#       uses: at-blacknight-projects/ci-templates/.github/workflows/container-release.yml@v1
#       with:
#         images: '[{"name": "", "context": ".", "file": "Dockerfile"}]'
#       secrets:
#         app-id: ${{ secrets.RELEASE_APP_ID }}
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      images: { description: 'JSON array of images (see stage-container-build).', type: string, default: '[{"name": "", "context": "."}]' }
      registry: { description: Registry host., type: string, default: ghcr.io }
      image-prefix: { description: Image path before the name. Empty means <registry>/<owner>/<repo>., type: string, default: "" }
      default-platforms: { description: Platforms for images that don't set their own., type: string, default: "linux/amd64,linux/arm64" }
      scan-severity: { description: Image vulnerabilities that fail the release., type: string, default: "CRITICAL,HIGH" }
      sarif: { description: Upload image findings to the Security tab., type: boolean, default: true }
      sign: { description: Sign images with cosign., type: boolean, default: true }
      attest: { description: Attest image build provenance., type: boolean, default: true }
      replacements: { description: 'JSON array of {"file", "pattern", "replacement"} version edits.', type: string, default: "[]" }
      bump-command: { description: Extra version-bump command (VERSION is set)., type: string, default: "" }
      git-user-name: { description: "Release commit author. Empty uses the GitHub App bot, or github-actions[bot].", type: string, default: "" }
      git-user-email: { description: "Release commit author email. Empty uses the bot noreply address.", type: string, default: "" }
    secrets:
      app-id: { required: false, description: GitHub App ID for releases past branch protection. }
      app-private-key: { required: false, description: GitHub App private key. }
      registry-username: { required: false, description: Registry user (empty uses GITHUB_TOKEN on ghcr.io). }
      registry-password: { required: false, description: Registry password or token. }
      cosign-private-key: { required: false, description: "Your cosign key, to sign with a key as well as keylessly." }
      cosign-password: { required: false, description: Password of the cosign key. }
    outputs:
      version: { description: Released version (empty if nothing was released)., value: "${{ jobs.release.outputs.version }}" }
      git-tag: { description: Released tag., value: "${{ jobs.release.outputs.git-tag }}" }

permissions:
  contents: read

jobs:
  version:
    name: Version
    uses: ./.github/workflows/stage-version-detect.yml
    secrets:
      app-id: ${{ secrets.app-id }}
      app-private-key: ${{ secrets.app-private-key }}

  bump:
    name: Bump
    needs: version
    if: needs.version.outputs.would-release == 'true'
    uses: ./.github/workflows/stage-version-bump.yml
    with:
      version: ${{ needs.version.outputs.version }}
      replacements: ${{ inputs.replacements }}
      bump-command: ${{ inputs.bump-command }}

  image:
    name: Image
    needs: [version, bump]
    uses: ./.github/workflows/stage-container-build.yml
    permissions: { contents: read, packages: write, id-token: write, attestations: write, security-events: write }
    with:
      images: ${{ inputs.images }}
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      channel: ${{ needs.version.outputs.release-channel }}
      publish: true
      registry: ${{ inputs.registry }}
      image-prefix: ${{ inputs.image-prefix }}
      default-platforms: ${{ inputs.default-platforms }}
      restore-artifact: release-files
      scan-severity: ${{ inputs.scan-severity }}
      sarif: ${{ inputs.sarif }}
      sign: ${{ inputs.sign }}
      attest: ${{ inputs.attest }}
    secrets:
      registry-username: ${{ secrets.registry-username }}
      registry-password: ${{ secrets.registry-password }}
      cosign-private-key: ${{ secrets.cosign-private-key }}
      cosign-password: ${{ secrets.cosign-password }}

  release:
    name: Release
    needs: [version, bump, image]
    uses: ./.github/workflows/stage-release-semantic.yml
    permissions: { contents: write, issues: write, pull-requests: write }
    with:
      git-user-name: ${{ inputs.git-user-name }}
      git-user-email: ${{ inputs.git-user-email }}
      download-artifacts: false
      restore-artifact: release-files
      git-commit-files: ${{ needs.bump.outputs.files }}
    secrets:
      app-id: ${{ secrets.app-id }}
      app-private-key: ${{ secrets.app-private-key }}
