name: Helm CI

# Public API for chart-only repos: PR title, chart lint/render/kubeconform, and the
# security scan (Trivy's misconfig scanner reads charts). Wiring only; see CLAUDE.md.
#
#   on: { pull_request: {}, push: { branches: [main] } }
#   permissions: { contents: read, pull-requests: read, security-events: write }
#   jobs:
#     ci:
#       uses: at-blacknight-projects/ci-templates/.github/workflows/helm-ci.yml@v1

on:
  workflow_call:
    inputs:
      charts: { description: "Chart directories, one per line. Empty finds every Chart.yaml.", type: string, default: "" }
      kubernetes-version: { description: Kubernetes version rendered charts are validated against., type: string, default: "1.33.0" }
      pr-title: { description: Check PR titles are conventional commits., type: boolean, default: true }
      security-scan: { description: Run the Trivy filesystem scan., type: boolean, default: true }
      security-severity: { description: Severities that fail the scan., type: string, default: "CRITICAL,HIGH" }
      sarif: { description: Upload findings to the Security tab., type: boolean, default: true }

permissions:
  contents: read

jobs:
  pr:
    name: PR
    if: github.event_name == 'pull_request' && inputs.pr-title
    uses: ./.github/workflows/stage-pr-checks.yml
    permissions: { contents: read, pull-requests: read }

  helm:
    name: Helm
    uses: ./.github/workflows/stage-helm-lint.yml
    with:
      charts: ${{ inputs.charts }}
      kubernetes-version: ${{ inputs.kubernetes-version }}

  security:
    name: Security
    if: inputs.security-scan
    uses: ./.github/workflows/stage-security-scan.yml
    permissions: { contents: read, security-events: write }
    with:
      severity: ${{ inputs.security-severity }}
      sarif: ${{ inputs.sarif }}
